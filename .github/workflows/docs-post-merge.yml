name: Documentation post-merge

# The bot's follow-up after a merge into a truth branch (spec 4.3, 7.5):
# inverse relations in the target documents and their target state, in one
# bot commit on the branch. Releases (spec 7.2): a REL merged to main with
# phase planned gets phase development, and the bot creates release/vX.Y.Z
# from main; a merge of release/vX.Y.Z into main deletes that branch. Merges
# into release branches never delete anything. A merged release record
# (`release tag vX.Y.Z`: REL released, or a new entry in `patches`) gets its
# tag vX.Y.Z on the merge commit; an existing tag means nothing to do.
#
# Runs on push to main and release/*. Both are truth branches: their workflow
# file and cli/ only change through reviewed, merged PRs, so the CLI is built
# from the pushed commit itself. The bot key comes from the `bot` environment
# (deployment branches: main and release/*); BOT_CLIENT_ID is a repository
# variable. The run is idempotent: with nothing to do it writes nothing, so
# the bot's own commit (which triggers this workflow again) does not loop.
# Actions are pinned to commit SHAs (tag in the comment).
#
# Lost runs: GitHub keeps only one *pending* run per concurrency group, so a
# queued run can be cancelled by a newer push (for example the bot's own
# commit). Each run therefore handles everything since the last commit that
# post-merge finished (`--marker`: post-merge/<branch>.json on meta/index,
# bot-only), not only its own push; it records its commit when done. Every
# step is idempotent, so handling a commit twice changes nothing.

on:
  push:
    branches:
      - main
      - "release/*"

permissions:
  contents: read

concurrency:
  group: docs-post-merge-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  post-merge:
    runs-on: ubuntu-24.04
    environment: bot
    steps:
      - name: Pushed commit, with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build the CLI
        working-directory: cli
        run: npm ci && npm run build

      - name: Plan and validate (read-only token)
        id: plan
        env:
          # Reads the last handled commit from meta/index; cannot write.
          IDC365_DECISIONS_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node cli/dist/index.js post-merge --dry-run --marker --branch "$BRANCH" --before "$BEFORE" --after "$AFTER" --json > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          outcome=$(node -p "require(process.env.RUNNER_TEMP + '/plan.json').outcome")
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          git checkout -- .

      - name: Bot token
        # Also when there is nothing to do: the run still records its commit as handled.
        if: steps.plan.outputs.outcome == 'dry-run' || steps.plan.outputs.outcome == 'nothing'
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit the edits
        if: steps.plan.outputs.outcome == 'dry-run' || steps.plan.outputs.outcome == 'nothing'
        env:
          IDC365_DECISIONS_TOKEN: ${{ steps.bot.outputs.token }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node cli/dist/index.js post-merge --marker --branch "$BRANCH" --before "$BEFORE" --after "$AFTER" | tee -a "$GITHUB_STEP_SUMMARY"
